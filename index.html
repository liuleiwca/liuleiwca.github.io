<body>
  <iframe id="site" src="./content/" title="传奇资料站内容" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <footer class="entry-copy">
    <h1>传奇资料站｜新手指南、职业攻略与版本资料</h1>
    <p>传奇资料站整理新手指南、战法道职业攻略与版本资料，帮助玩家查找实用的游戏知识。</p>

  </footer>
  <script>
    const frame = document.getElementById('site');
    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== frame.contentWindow) return;
      if (event.data?.type === 'site-height' && Number.isFinite(event.data.height)) {
        frame.style.height = Math.min(20000, Math.max(600, event.data.height)) + 'px';
      }
    });
  </script>
